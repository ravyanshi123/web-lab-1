<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Bookstore</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        .logo { width: 50px; vertical-align: middle; }
        nav { background: #34495e; padding: 10px; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        nav a:hover { color: #f39c12; }
        .container { display: flex; height: calc(100vh - 110px); }
        .sidebar { width: 20%; background: #ecf0f1; padding: 15px; border-right: 2px solid #bdc3c7; }
        .sidebar a { display: block; padding: 10px; color: #333; text-decoration: none; border-bottom: 1px solid #ccc; font-weight: bold; }
        .sidebar a:hover { background: #bdc3c7; }
        .main-content { width: 80%; border: none; }
    </style>
</head>
<body>

    <!-- TOP FRAME -->
    <header>
        <h2>Online Bookstore</h2>
    </header>
    <nav>
        <a href="description.html" target="contentFrame">Home</a>
        <a href="login.html" target="contentFrame">Login</a>
        <a href="registration.html" target="contentFrame">Registration</a>
        <a href="catalogue.html" target="contentFrame">Catalogue</a>
        <a href="cart.html" target="contentFrame">Cart</a>
    </nav>

    <!-- MAIN CONTAINER (LEFT & RIGHT FRAMES) -->
    <div class="container">
        <!-- LEFT FRAME -->
        <div class="sidebar">
            <a href="catalogue.html" target="contentFrame">CSE</a>
            <a href="catalogue.html" target="contentFrame">ECE</a>
            <a href="catalogue.html" target="contentFrame">EEE</a>
            <a href="catalogue.html" target="contentFrame">CIVIL</a>
        </div>

        <!-- RIGHT FRAME -->
        <iframe name="contentFrame" src="description.html" class="main-content"></iframe>
    </div>

</body>
</html>
