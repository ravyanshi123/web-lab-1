<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: inline-block; width: 130px; vertical-align: top; }
        input[type="text"], input[type="password"], textarea, select { width: 250px; padding: 5px; }
        textarea { height: 60px; }
    </style>
</head>
<body>
    <h3>Registration Form</h3><br>
    <form>
        <div class="form-group">
            <label>Name:</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label>E-mail id:</label>
            <input type="text" name="email" required>
        </div>
        <div class="form-group">
            <label>Phone Number:</label>
            <input type="text" name="phone" required>
        </div>
        <div class="form-group">
            <label>Sex:</label>
            <input type="radio" name="sex" value="Male"> Male
            <input type="radio" name="sex" value="Female"> Female
        </div>
        <div class="form-group">
            <label>Date of birth:</label>
            <select name="day">
                <option>1</option><option>2</option><option>3</option>
            </select>
            <select name="month">
                <option>Jan</option><option>Feb</option><option>Mar</option>
            </select>
            <select name="year">
                <option>2000</option><option>2001</option><option>2002</option>
            </select>
        </div>
        <div class="form-group">
            <label>Languages known:</label>
            <input type="checkbox" name="lang" value="English"> English
            <input type="checkbox" name="lang" value="Telugu"> Telugu
            <input type="checkbox" name="lang" value="Hindi"> Hindi
            <input type="checkbox" name="lang" value="Tamil"> Tamil
        </div>
        <div class="form-group">
            <label>Address:</label>
            <textarea name="address"></textarea>
        </div>
        <button type="submit">Register</button>
    </form>
</body>
</html>
